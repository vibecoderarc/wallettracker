[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphagraph"
version = "0.1.0"
description = "Insider footprint intelligence — wallet discovery, tracking, and research"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "base58>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
alphagraph = "alphagraph.cli:app"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:alphagraph.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages"
ignore_missing_imports = true
warn_unused_ignores = false
